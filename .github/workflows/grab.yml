name: grab-cdx
on:
  push:
jobs:
  grab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch CDX index of zplusdesign.com
        run: |
          curl -s --max-time 300 "https://web.archive.org/cdx/search/cdx?url=zplusdesign.com&matchType=domain&fl=original,timestamp,statuscode,mimetype&collapse=urlkey&limit=10000" -o cdx.txt
          wc -l cdx.txt
          echo "---- sample ----"
          head -50 cdx.txt
      - name: Commit result
        run: |
          git config user.name "wayback-bot"
          git config user.email "bot@users.noreply.github.com"
          git add cdx.txt
          git commit -m "CDX index of zplusdesign.com" || echo "nothing to commit"
          git push
